# The desktop app for macOS (a .dmg to install from, and a .zip the app updates itself from) and
# for Windows (an installer, which also updates it) (docs/releasing.md). scripts/stage-app.mjs puts
# what the installed app needs in release/app, and electron-builder runs with that folder as its
# project, so paths here are relative to it. `pnpm dist:mac` and `pnpm dist:win` do both. The Mac
# app is signed and notarized when the Apple credentials are set, else signed ad hoc with
# `pnpm dist:mac:adhoc`, whose .dmg window says how to open it (docs/install-mac.md); the Windows
# one isn't signed yet.
appId: io.github.ahmedamr-r.qalam-studio
productName: Qalam Studio
copyright: Copyright © 2026 Ahmed Amr
directories:
  output: ../dist
  # The icon (icon.png) and other build resources, in the repository's build/.
  buildResources: ../../build
files:
  - "**/*"
  - "!**/*.map"
  - "!package-lock.json"
  # llama.cpp's source, for building it where no prebuilt binary fits: never done in the app.
  - "!node_modules/node-llama-cpp/llama/gitRelease.bundle"
  # The voice helper and the screenshot reader run from Resources (extraResources), not from inside the archive.
  - "!out/qalam-voice"
  - "!out/qalam-see"
# Native code is loaded from real files, outside the archive.
asarUnpack:
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
# node-llama-cpp ships prebuilt binaries: nothing to compile.
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  # Entitlements: electron-builder's own, and the microphone, for talking instead of typing. They're
  # build/entitlements.mac.plist and .inherit.plist, found in the build resources by those names: a
  # path set here would reach codesign as written, relative to where it runs, and fail to sign.
  extendInfo:
    NSMicrophoneUsageDescription: Qalam listens only while the mic is on, to type what you say.
    NSSpeechRecognitionUsageDescription: Qalam turns what you say into text on this Mac.
  darkModeSupport: true
  # The voice helper (native/voice, scripts/build-voice.mjs): Contents/Resources/qalam-voice.
  # The screenshot reader (native/see, scripts/build-see.mjs): Contents/Resources/qalam-see.
  # Both are the Mac's own; Windows has neither.
  extraResources:
    - from: out/qalam-voice
      to: qalam-voice
    - from: out/qalam-see
      to: qalam-see
  # The zip's name (the .dmg names its own below).
  artifactName: Qalam-Studio-${version}-${arch}-mac.${ext}
dmg:
  artifactName: Qalam-Studio-${version}-${arch}.${ext}
  # electron-builder's window (540 × 380, the app at 130,220 and Applications at 410,220). The
  # ad-hoc build's background (build/dmg-open-anyway.tiff) writes how to open it around them.
  iconSize: 80
win:
  target:
    - target: nsis
      arch: x64
  artifactName: Qalam-Studio-${version}-${arch}-setup.${ext}
# Installed for this person, where they choose; the installer is also what the app updates itself from.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# Releases go up as drafts, published by hand once checked. A draft starts with how to install it.
releaseInfo:
  releaseNotesFile: ../../build/release-notes.md
publish:
  provider: github
  owner: ahmedamr-r
  repo: qalam-studio
  releaseType: draft
