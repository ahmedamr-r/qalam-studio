# Builds Qalam Studio for macOS (Apple silicon). For a version tag (v0.1.0…) it publishes the .dmg,
# the .zip the app updates itself from and latest-mac.yml as a draft GitHub release, signed and
# notarized with the Apple credentials in the repository's secrets (docs/releasing.md); it won't
# publish without them. Run by hand (Actions ▸ Release ▸ Run workflow), it builds without
# publishing, signed when the secrets are there, and keeps the files with the run for a week.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The voice helper (native/voice) uses Apple's speech engine, in the macOS 26 SDK.
      - name: Xcode 26 or later
        run: |
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 or later on this runner: the voice helper needs its SDK."; exit 1; fi
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Check
        run: pnpm typecheck && pnpm test

      - name: The tag names the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi

      - name: Build (and publish, for a tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate: the .p12 as base64, and its password.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # App Store Connect API key for notarizing: the .p8 file's contents, its id and issuer.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        run: |
          if [ "$PUBLISH" = always ] && { [ -z "$CSC_LINK" ] || [ -z "$APPLE_API_KEY_P8" ]; }; then
            echo "::error::A release must be signed and notarized: add the Apple secrets first (docs/releasing.md)."
            exit 1
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm dist:mac --publish "$PUBLISH"

      - name: Keep the files with the run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qalam-studio-mac
          path: |
            release/dist/*.dmg
            release/dist/*.zip
            release/dist/latest-mac.yml
          retention-days: 7
